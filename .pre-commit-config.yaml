repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
      - id: check-ast
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-merge-conflict
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: requirements-txt-fixer
      - id: trailing-whitespace
        args: [--chars,"  "]

  # NOTE: no pyupgrade, absolufy-imports or ruff format here. Most of pyasdm
  # is generated from the ALMA code-generation templates (formatted with
  # black), so it only gets ruff's error checks (see [tool.ruff.lint] in
  # pyproject.toml).

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check        # error checks only (see [tool.ruff.lint])
        args: [--fix]

  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout
