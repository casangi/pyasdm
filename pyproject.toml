[project]
name = "pyasdm"
version = "0.0.9.dev1"
description = ""
authors = [
    {name = "Bob Garwood", email="bgarwood@nrao.edu"}
]
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">= 3.12, < 3.15"

dependencies = [
    'pytest',
    'pytest-cov',
    'pytest-html',
    'pympler',
    'numpy'

]

[project.optional-dependencies]
docs = [
    'nbsphinx',
    'recommonmark',
    'scanpydoc',
    'sphinx-autoapi',
    'sphinx-autosummary-accessors',
    'sphinx_rtd_theme',
    'twine',
    'pandoc'
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Errors only: most of pyasdm is generated from the ALMA code-generation
# templates, so style rules and `ruff format` are not applied here (the code
# is formatted with black). These rules catch code that cannot work:
#   E9       -- syntax errors
#   F63, F7  -- invalid comparisons, misplaced return/yield/break/continue
#   F82      -- undefined names
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.lint.per-file-ignores]
# Undefined names that are real bugs (NameError at runtime), to be fixed in a
# follow-up. ASDM.py is generated: fix it in the almasw template.
"src/pyasdm/ASDM.py" = ["F821"]
"src/pyasdm/EndianOutput.py" = ["F821"]
"src/pyasdm/types/AngularRate.py" = ["F821"]
"src/pyasdm/types/ArrayTime.py" = ["F821"]
"src/pyasdm/types/ArrayTimeInterval.py" = ["F821"]
"src/pyasdm/types/Complex.py" = ["F821"]
"src/pyasdm/types/EntityRef.py" = ["F821"]
"src/pyasdm/types/Humidity.py" = ["F821"]
"src/pyasdm/types/Length.py" = ["F821"]
"tests/test_Entity.py" = ["F821"]
