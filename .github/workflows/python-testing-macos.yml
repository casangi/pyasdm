# Run the macOS tests using the shared VIPER template.
# Runs on pull requests and merges to main only (not on every branch push).
name: MacOS

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - '**.rst'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '**.rst'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  call-testing-macos:
    uses: nrao/gh-actions-templates-public/.github/workflows/python-testing-macos-template.yml@17-ci-python-312-314-push-pr-split
    with:
      python-versions: '["3.12", "3.13", "3.14"]'
