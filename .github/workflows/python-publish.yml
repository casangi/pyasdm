# .github/workflows/python-publish.yml
# Publishes pyasdm to PyPI whenever a GitHub release is published.
# Uses the same shared NRAO template as XRADIO. See release.md for the release procedure.
# Pull requests and merges to main also build the sdist/wheel as a check; the
# template's publish job only runs for a release (tag ref).
name: Publish Python 🐍 distribution 📦 to PyPI and TestPyPI

on:
  release:
    types: [published]
  pull_request:
    paths-ignore:
      - '**.md'
      - '**.rst'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '**.rst'

jobs:
  call-publish:
    uses: nrao/gh-actions-templates-public/.github/workflows/python-publish-cngi-template.yml@17-ci-python-312-314-push-pr-split
    with:
      pypi-url: "https://pypi.org/project/pyasdm"
    secrets:
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }} # Explicit pass instead of inherit
